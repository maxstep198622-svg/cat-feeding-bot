# Настройки бота «Стефа и Фая» — расписание семьи.
# Значения с пометкой ⚠️ уточняются по мере того, как семья присылает данные.
# Проверка без Telegram:  python -m catbot --check   (и --date 2026-10-17 для субботы)
# Обоснование расписания — в ПЛАН_КОРМЛЕНИЯ.md.
# Семейный код здесь не хранится: установщик (deploy/install.sh) сам придумывает его
# и записывает на сервере в .env как CATBOT_JOIN_CODE.

timezone = "Europe/Moscow"          # ⚠️ ваш часовой пояс, например Asia/Novosibirsk
db_path = "data/catbot.sqlite3"
holidays = ["2026-11-04", "2026-12-31"]   # праздники — по расписанию выходного

[reminders]
repeat_every_min = 10       # повторять напоминание, пока не нажали «Готово»
max_repeats = 2             # сколько раз повторить
snooze_min = 10             # кнопка «⏰ Через 10 мин»
escalate_after_min = 30     # через сколько минут написать запасному и родителям
give_up_after_min = 150     # после этого кормление считается пропущенным
followup_min = 30           # через сколько минут после «Готово» спросить про остатки
daily_report = "22:45"      # вечерняя сводка родителям ("" — не присылать)
notify_parents_on_child_done = true
notify_parents_on_home = true    # «🏠 Тася дома (14:05)»
home_window_min = 180            # «Я дома» сразу присылает задачу, если до неё ≤ 3 ч

# Множители к RER = 70 × вес^0,75. Менять — только вместе с ветеринаром.
[energy]
kitten_0_4m = 2.5           # MSD, AAHA 2021
kitten_4_6m = 2.2           # по уравнению роста NRC 2006
kitten_6_9m = 1.9
kitten_9_12m = 1.6
kitten_spay_cut = 0.10      # после стерилизации котёнка −10% (ещё −10%, если вес растёт быстрее кривой)
spay_recovery_days = 14     # первые 2 недели после операции норму не урезаем
adult_intact = 1.4
adult_neutered = 1.1        # стартовое: 1,2 — стройная (5/9), 1,0 — полноватая (6/9+)

# --- Семья -----------------------------------------------------------------
[[members]]
id = "papa"
name = "Папа"
role = "parent"
# telegram_id = 123456789   # если указать, подключиться «Папой» сможет только этот аккаунт

[[members]]
id = "tanya"
name = "Таня"
role = "parent"

[[members]]
id = "tasya"
name = "Тася"
role = "child"

# --- Кошки -----------------------------------------------------------------
[[cats]]
id = "faya"
name = "Фая"
emoji = "🐱"
birth_date = "2026-07-12"   # ⚠️ примерно: 3 месяца на 12.10.2026
weight_kg = 1.5             # ⚠️ ВЗВЕСЬТЕ на кухонных весах; дальше вес — командой /weight
neutered = false
# После стерилизации:
# neutered = true
# neutered_on = "2026-11-25"

[[cats]]
id = "stefa"
name = "Стефа"
emoji = "🐈"
birth_date = "2025-10-12"   # ⚠️ примерно: 1 год
weight_kg = 4.0             # ⚠️ ВЗВЕСЬТЕ
neutered = true
# ideal_weight_kg = 4.0     # если ветеринар скажет, что она полновата, — впишите идеальный вес
# daily_kcal = 210          # если ветеринар назвал точную норму — она важнее расчёта

# --- Корма -----------------------------------------------------------------
# ⚠️ ЗАМЕНИТЕ калорийность на цифры с ваших упаковок («Энергетическая ценность»
# или «обменная энергия»). Если указано в ккал/кг — пишите kcal_per_kg = 4000.
# Если в кДж — разделите на 4,184. Если на упаковке нет — сайт производителя или ветеринар.
[[foods]]
id = "kitten_wet"
name = "влажный для котят"
kind = "wet"
kcal_per_100g = 100

[[foods]]
id = "kitten_dry"
name = "сухой для котят"
kind = "dry"
kcal_per_100g = 400

[[foods]]
id = "adult_wet"
name = "влажный для стерилизованных"
kind = "wet"
kcal_per_100g = 85

[[foods]]
id = "adult_dry"
name = "сухой для стерилизованных"
kind = "dry"
kcal_per_100g = 370

# --- Режимы дня --------------------------------------------------------------
# weekday (будни) и weekend (выходной) есть всегда. Свои режимы — здесь.
# Переключить на сегодня/завтра: команда /mode (родители). На период — [[periods]].
[modes]
kanikuly = "Каникулы / кто-то дома весь день"
papa_away = "Папа уходит рано или в отъезде"


# ⚠️ Каникулы Таси: впишите даты своей школы.
# [[periods]]
# start = "2026-10-26"
# end = "2026-11-03"
# mode = "kanikuly"

# =============================================================================
# РАСПИСАНИЕ
# share — доля суточной нормы кошки. За день у каждой кошки сумма = 1.0 (100%).
# Граммы бот считает сам из веса, возраста и калорийности корма.
# meal — ключ приёма: у одного и того же кормления в разных режимах он одинаковый
#   (завтрак будней = завтрак выходного). Если режим дня сменили, бот по нему поймёт,
#   что этот приём сегодня уже дали, и не предложит покормить второй раз.
# =============================================================================

# ---------- БУДНИ: Фая днём в своей комнате (вариант Б1) ----------

